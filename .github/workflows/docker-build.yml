name: EC2 Image Build on Employment_feature

on:
  push:
    branches: [ feature/employment ]

jobs:
  docker:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS 자격 증명
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: 590183984850.dkr.ecr.ap-northeast-2.amazonaws.com/employment_develop:latest

      # 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_REMOTE_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 590183984850.dkr.ecr.ap-northeast-2.amazonaws.com
            docker pull 590183984850.dkr.ecr.ap-northeast-2.amazonaws.com/employment_develop:latest
            docker stop spring-app || true
            docker rm spring-app || true
            docker run -d --name spring-app \
              -p 8080:8080 \
              --restart unless-stopped \
              590183984850.dkr.ecr.ap-northeast-2.amazonaws.com/employment_develop:latest

      # 배포 검증
      - name: Verify deployment
        run: |
          sleep 30  # 애플리케이션 시작 대기
          curl -f http://${{ secrets.EC2_REMOTE_IP }}:8080/actuator/health || exit 1